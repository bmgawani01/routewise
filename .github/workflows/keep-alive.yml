name: Keep Render Awake
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render
        run: |
          curl -s -L --max-time 120 https://routewise-ccot.onrender.com > /dev/null || true
           echo "Pinged - Render will stay awake"
