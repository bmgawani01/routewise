name: Keep Routewise Awake
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping API and DB
        run: |
          curl -s https://routewise-ccot.onrender.com/ > /dev/null
          curl -s https://routewise-ccot.onrender.com/keep-db-alive > /dev/null
          echo "Pinged both Render and MySQL"
