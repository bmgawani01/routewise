<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#157a52">
<meta name="description" content="Routewise driver onboarding portal">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23157a52'/%3E%3Cpath d='M8 21h6v-8H8zm9-8v8h6v-8z' fill='white' opacity='.5'/%3E%3Cpath d='M13.5 10V6h-5v4zm10 0V6h-5v4z' fill='white'/%3E%3C/svg%3E">
<title>Routewise — Driver Onboarding</title>
<script src="assets/vendor/lucide.min.js"></script>
<style>
:root{--bg:#f5f7f6;--surface:#fff;--text:#12211b;--muted:#5f6f68;--line:#e2e8e4;--primary:#157a52;--primary2:#0f6b49;--accent:#d98410;--green:#157a52;--amber:#b45309;--red:#c0392b;--blue:#2563eb;--grad:linear-gradient(135deg,#0f6b49 0%,#1a8f61 100%);--grad-2:linear-gradient(135deg,#10352a,#1c5c45);--shadow:0 22px 50px -28px rgba(16,49,38,.45);--shadow-soft:0 14px 36px -24px rgba(16,49,38,.4);--radius:16px;--pop:cubic-bezier(.34,1.56,.64,1)}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;min-height:100vh;font:14px Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--text);overflow-x:hidden;background:radial-gradient(1000px 560px at 10% -10%,#e4f1ea 0%,rgba(228,241,234,0) 60%),radial-gradient(860px 500px at 104% 2%,#eef1f3 0%,rgba(238,241,243,0) 55%),radial-gradient(760px 520px at 50% 116%,#eaf2ee 0%,rgba(234,242,238,0) 58%),var(--bg)}
body::before,body::after{content:"";position:fixed;border-radius:50%;filter:blur(80px);opacity:.22;pointer-events:none;z-index:0}
body::before{width:520px;height:520px;left:-140px;top:-140px;background:radial-gradient(circle at 30% 30%,#bfe3d1,#8fc9ac);animation:floatA 18s ease-in-out infinite}
body::after{width:470px;height:470px;right:-150px;bottom:-160px;background:radial-gradient(circle at 30% 30%,#d3dbd6,#aebbb4);animation:floatB 20s ease-in-out infinite}
#app{position:relative;z-index:1}
.bg-slideshow{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none;background:var(--bg)}
.bg-slideshow span{position:absolute;inset:0;background-size:cover;background-position:center;opacity:0;transform:scale(1.12) translateX(4%);animation:bgSlide 42s linear infinite}
.bg-slideshow span:nth-child(1){animation-delay:0s}
.bg-slideshow span:nth-child(2){animation-delay:6s}
.bg-slideshow span:nth-child(3){animation-delay:12s}
.bg-slideshow span:nth-child(4){animation-delay:18s}
.bg-slideshow span:nth-child(5){animation-delay:24s}
.bg-slideshow span:nth-child(6){animation-delay:30s}
.bg-slideshow span:nth-child(7){animation-delay:36s}
.bg-slideshow::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(245,247,246,.72),rgba(245,247,246,.87))}
@keyframes bgSlide{0%{opacity:0;transform:scale(1.12) translateX(4%)}2%{opacity:1}12%{opacity:1}14.3%{opacity:0;transform:scale(1.02) translateX(-3%)}100%{opacity:0;transform:scale(1.02) translateX(-3%)}}
@keyframes floatA{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(70px,50px) scale(1.14)}}
@keyframes floatB{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(-60px,-40px) scale(1.12)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes popIn{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:scale(1)}}
@keyframes shimmer{to{background-position:250% 0}}
@keyframes shake{10%,90%{transform:translateX(-1px)}20%,80%{transform:translateX(2px)}30%,50%,70%{transform:translateX(-5px)}40%,60%{transform:translateX(5px)}}
@keyframes pulseGlow{0%,100%{box-shadow:0 0 0 0 rgba(21,122,82,.3)}50%{box-shadow:0 0 0 14px rgba(21,122,82,0)}}
@keyframes confettiFall{to{transform:translateY(112vh) rotate(760deg);opacity:0}}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
h1,h2,h3,p{margin:0}
.auth-page{min-height:100vh;display:grid;place-items:center;padding:30px 20px}
.auth-shell{width:min(1120px,100%);display:grid;grid-template-columns:1.05fr .95fr;gap:46px;align-items:center}
.auth-hero{animation:none}
.auth-panel{width:100%;animation:none}
.brand-lockup{display:flex;align-items:center;gap:11px;font-size:21px;font-weight:800;letter-spacing:-.5px}
.brand-mark{width:38px;height:38px;border-radius:12px;background:var(--grad);color:#fff;display:grid;place-items:center;box-shadow:0 10px 22px -8px rgba(15,107,73,.6);animation:pulseGlow 3.4s ease-in-out infinite}
.brand-tag{display:inline-flex;align-items:center;gap:7px;font-size:11px;color:#0f6b49;font-weight:800;text-transform:uppercase;letter-spacing:.14em;margin-top:26px;background:#e7f3ed;border:1px solid #cfe8dc;padding:6px 12px;border-radius:999px}
.auth-copy{margin:24px 0 8px}
.auth-copy h1{font-size:34px;line-height:1.1;letter-spacing:-1px;color:var(--text)}
.auth-copy p{color:var(--muted);line-height:1.65;margin-top:10px;max-width:44ch}
.motto{margin-top:16px;font-size:16px;font-weight:800;letter-spacing:.01em;background:linear-gradient(90deg,#0f6b49,#1fa96f,#0f6b49);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shimmer 7s linear infinite}
.motto-sub{font-size:12px;color:var(--muted);margin-top:6px;font-weight:600}
@keyframes introPop{from{opacity:0;transform:translateY(26px) scale(.93)}to{opacity:1;transform:none}}
.auth-hero>.brand-lockup{animation:introPop .6s var(--pop) both;animation-delay:.05s}
.auth-hero>.brand-tag{animation:introPop .6s var(--pop) both;animation-delay:.18s}
.auth-copy>h1{animation:introPop .6s var(--pop) both;animation-delay:.32s}
.auth-copy>p:nth-child(2){animation:introPop .6s var(--pop) both;animation-delay:.44s}
.auth-copy>.motto{animation:introPop .6s var(--pop) both,shimmer 7s linear infinite;animation-delay:.56s,0s}
.auth-copy>.motto-sub{animation:introPop .6s var(--pop) both;animation-delay:.68s}
.auth-hero>.perk-carousel{animation:introPop .6s var(--pop) both;animation-delay:.8s}
.auth-card{animation:introPop .65s var(--pop) both;animation-delay:.9s}
.auth-card>.segmented{animation:introPop .5s var(--pop) both;animation-delay:1s}
.auth-card .field{animation:introPop .5s var(--pop) both}
.auth-card .field:nth-child(1){animation-delay:1.08s}
.auth-card .field:nth-child(2){animation-delay:1.18s}
.auth-card .field:nth-child(3){animation-delay:1.28s}
.auth-card .field:nth-child(4){animation-delay:1.38s}
.auth-card .primary-button{animation:introPop .5s var(--pop) both;animation-delay:1.5s}
.auth-card>.auth-note{animation:introPop .5s var(--pop) both;animation-delay:1.6s}
.auth-card,.card{background:rgba(255,255,255,.9);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.75);border-radius:var(--radius);padding:26px;box-shadow:var(--shadow-soft);position:relative;overflow:hidden}
.auth-card::before,.card::before{content:"";position:absolute;inset:0 0 auto 0;height:4px;background:var(--grad)}
.card{animation:fadeUp .5s cubic-bezier(.22,1,.36,1) both}
.card>*{animation:fadeUp .5s cubic-bezier(.22,1,.36,1) both}
.card>*:nth-child(2){animation-delay:.05s}
.card>*:nth-child(3){animation-delay:.1s}
.card>*:nth-child(4){animation-delay:.14s}
.card>*:nth-child(5){animation-delay:.18s}
.segmented{display:grid;grid-template-columns:1fr 1fr;background:#eef3f0;padding:4px;border-radius:12px;margin-bottom:20px}
.segmented button{border:0;background:transparent;padding:9px;border-radius:9px;color:#6d7a74;font-weight:650;transition:.25s}
.segmented button.active{background:#fff;color:#0f6b49;box-shadow:0 6px 16px -8px rgba(21,122,82,.55)}
.field{display:grid;gap:6px;margin-bottom:14px}
.field label,.fieldlegend{font-size:12px;font-weight:700;color:#3f4d47}
.field input,.field select,.field textarea{padding:11px 12px;border:1px solid var(--line);border-radius:11px;outline:none;background:#fff;color:var(--text);width:100%;transition:.22s}
.field input:focus,.field select:focus,.field textarea:focus{border-color:#7bbfa3;box-shadow:0 0 0 4px rgba(21,122,82,.16)}
.field input[readonly]{background:#f6f8f7;color:#8a9791}
.field .hint{font-size:11px;color:#8a9791;font-weight:500}
.primary-button,.secondary-button{border-radius:12px;padding:11px 16px;border:1px solid var(--line);display:inline-flex;align-items:center;gap:8px;font-weight:700;justify-content:center;position:relative;overflow:hidden;transition:transform .2s,box-shadow .2s,background .2s}
.primary-button{background:var(--grad);color:#fff;border-color:transparent;box-shadow:0 14px 30px -14px rgba(15,107,73,.7)}
.primary-button:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 20px 38px -16px rgba(15,107,73,.78)}
.primary-button:disabled{opacity:.55;cursor:default}
.secondary-button{background:#fff;color:#0f6b49}
.secondary-button:hover{border-color:#bfe0cf;transform:translateY(-2px);box-shadow:0 12px 26px -18px rgba(15,107,73,.55)}
.ripple{position:absolute;width:12px;height:12px;border-radius:50%;background:rgba(255,255,255,.55);transform:translate(-50%,-50%) scale(0);animation:ripple .6s ease-out;pointer-events:none}
@keyframes ripple{to{transform:translate(-50%,-50%) scale(22);opacity:0}}
.full-width{width:100%}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.full{grid-column:1/-1}
.form-footer{display:flex;justify-content:flex-end;gap:10px;margin-top:22px;align-items:center}
.form-footer .spacer{flex:1}
.auth-note{font-size:12px;color:var(--muted);text-align:center;margin-top:16px;line-height:1.6}
.notice{display:flex;gap:9px;align-items:flex-start;font-size:12px;color:#3f4d47;background:#eef4f1;border-radius:12px;padding:12px 14px;margin-bottom:16px;line-height:1.6;border:1px solid #dbe7e1}
.notice.error{background:#fef3f2;color:var(--red);border-color:#fecdc9}
.notice svg{flex-shrink:0;margin-top:1px}
.onboarding-wrap{width:min(860px,100%);margin:0 auto;padding:38px 0}
.onboarding-header{display:flex;justify-content:space-between;align-items:center;gap:14px;margin:26px 0 20px;animation:fadeUp .5s both}
.onboarding-header h1{font-size:27px;letter-spacing:-.7px;color:var(--text)}
.onboarding-header p{color:var(--muted);margin-top:6px}
.stepper{display:flex;gap:8px;margin-bottom:10px}
.step{flex:1;color:#8a9791;display:flex;align-items:center;gap:8px;font-size:12px;transition:color .3s}
.step .step-number{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:#e9efeb;flex-shrink:0;transition:.35s}
.step.active{color:#0f6b49;font-weight:800}
.step.complete{color:#4a5a53}
.step.active .step-number,.step.complete .step-number{background:var(--grad);color:#fff;box-shadow:0 8px 18px -10px rgba(15,107,73,.7)}
.progress-rail{height:5px;border-radius:999px;background:#e9efeb;overflow:hidden;margin-bottom:26px}
.progress-rail span{display:block;height:100%;border-radius:999px;background:var(--grad);transition:width .55s cubic-bezier(.22,1,.36,1)}
.card h2{font-size:20px;letter-spacing:-.3px}
.card .card-sub{color:var(--muted);margin:6px 0 20px;line-height:1.6}
.divider{height:1px;background:var(--line);margin:18px 0}
.stackrow{margin-bottom:20px}
.radio-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.radio-tile{position:relative;border:0;background:transparent;padding:0;height:124px;perspective:900px;cursor:pointer;color:#4a5a53}
.tile-inner{position:relative;display:block;width:100%;height:100%;transform-style:preserve-3d;transition:transform .65s cubic-bezier(.22,1,.36,1)}
.radio-tile:hover .tile-inner,.radio-tile:focus-visible .tile-inner{transform:rotateY(180deg)}
.tile-face{position:absolute;inset:0;border-radius:15px;border:1px solid var(--line);background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px;backface-visibility:hidden;-webkit-backface-visibility:hidden;font-weight:700;font-size:12px;text-align:center;padding:12px;box-shadow:0 10px 24px -20px rgba(16,49,38,.5)}
.tile-back{transform:rotateY(180deg);background:var(--grad-2);color:#fff;font-weight:500;font-size:11.5px;line-height:1.5}
.tile-back strong{font-size:12.5px;font-weight:800;display:block;margin-bottom:3px}
.radio-tile.sel .tile-front,.radio-tile.sel .tile-back{box-shadow:0 0 0 3px rgba(21,122,82,.4),0 18px 30px -18px rgba(15,107,73,.7)}
.tile-check{position:absolute;top:8px;right:8px;width:21px;height:21px;border-radius:50%;background:var(--grad);color:#fff;display:none;place-items:center;z-index:3;box-shadow:0 4px 10px -5px rgba(15,107,73,.8)}
.radio-tile.sel .tile-check{display:grid;animation:popIn .3s both}
.upload-box{border:1.5px dashed #cad9d2;border-radius:15px;padding:18px;display:flex;align-items:center;gap:14px;cursor:pointer;background:#fff;transition:.28s}
.upload-box:hover{border-color:#7bbfa3;transform:translateY(-2px);box-shadow:0 18px 34px -24px rgba(15,107,73,.6)}
.upload-ic{width:44px;height:44px;border-radius:12px;background:#eaf3ee;display:grid;place-items:center;color:#157a52;flex-shrink:0;transition:.28s}
.upload-box:hover .upload-ic{background:var(--grad);color:#fff;transform:scale(1.06) rotate(-4deg)}
.upload-box .up-label{font-weight:700}
.upload-box .up-meta{font-size:12px;color:#8a9791;margin-top:2px}
.upload-box.done{border-style:solid;border-color:#157a52;background:linear-gradient(180deg,#f1faf5,#fff)}
.upload-box.done .upload-ic{background:#157a52;color:#fff}
.upload-box input{display:none}
.confirm-row{display:flex;gap:10px;align-items:flex-start;font-size:13px;color:#3f4d47;margin-top:16px}
.confirm-row input{margin-top:2px;accent-color:#157a52;width:16px;height:16px}
.check-row{display:flex;gap:12px;padding:13px 0;border-bottom:1px solid #eef2ef;align-items:flex-start}
.check-row:last-child{border:0}
.check-ic{width:38px;height:38px;border-radius:11px;background:#eaf3ee;display:grid;place-items:center;color:#157a52;flex-shrink:0}
.check-row .ch-name{font-weight:700}
.check-row .ch-det{font-size:12px;color:#8a9791;margin-top:2px}
.check-row.done .check-ic{background:#e7f8f0;color:var(--green)}
.review-list{border:1px solid var(--line);border-radius:14px;margin-bottom:6px;overflow:hidden;background:#fff}
.review-row{display:flex;justify-content:space-between;gap:16px;padding:13px 15px;border-bottom:1px solid var(--line);font-size:13px}
.review-row:last-child{border:0}
.review-row span{color:#8a9791}
.review-row strong{text-align:right}
.review-sec{font-weight:800;font-size:12px;text-transform:uppercase;letter-spacing:.09em;color:var(--primary);margin:20px 0 8px}
.review-sec:first-child{margin-top:0}
.success-box{text-align:center;padding:16px 10px 6px}
.success-ic{width:70px;height:70px;border-radius:50%;background:var(--grad);color:#fff;display:grid;place-items:center;margin:0 auto 18px;box-shadow:0 20px 40px -20px rgba(15,107,73,.75);animation:popIn .5s both}
.success-box h2{font-size:23px;letter-spacing:-.5px}
.success-box p{color:var(--muted);margin-top:8px;line-height:1.65}
.pipeline{display:grid;gap:0;margin:26px 0 8px;position:relative}
.pipe-step{display:flex;gap:14px;align-items:flex-start;padding-bottom:26px;position:relative;animation:fadeUp .5s both}
.pipe-step:nth-child(2){animation-delay:.08s}
.pipe-step:nth-child(3){animation-delay:.16s}
.pipe-dot{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:#e9efeb;color:#8a9791;flex-shrink:0;position:relative;z-index:1;transition:.4s}
.pipe-line{position:absolute;left:13px;top:28px;bottom:2px;width:2px;background:#e9efeb}
.pipe-step:last-child .pipe-line{display:none}
.pipe-step.done .pipe-dot{background:var(--grad);color:#fff;box-shadow:0 0 0 5px rgba(21,122,82,.12)}
.pipe-step.next .pipe-dot{background:#fff;border:2px solid #cad9d2;color:#8a9791}
.pipe-step.done .pipe-line{background:linear-gradient(#0f6b49,#1a9c6b)}
.pipe-step .pipe-copy strong{display:block;font-size:13px}
.pipe-step .pipe-copy p{font-size:12px;color:#8a9791;margin-top:2px;line-height:1.5}
.status-pill{display:inline-flex;border-radius:999px;padding:5px 11px;font-size:11px;font-weight:800}
.status-pill.green{background:#e7f8f0;color:var(--green)}
.status-pill.amber{background:#fffaeb;color:var(--amber)}
.status-pill.red{background:#fef3f2;color:var(--red)}
.status-pill.blue{background:#eff4ff;color:var(--blue)}
.otp-row{display:flex;gap:10px;justify-content:center;margin:26px 0 20px}
.otp-row.shake{animation:shake .5s}
.otp-box{width:50px;height:58px;border:1.5px solid var(--line);border-radius:13px;text-align:center;font-size:25px;font-weight:800;outline:none;color:#0f6b49;transition:.25s;background:#fff}
.otp-box:focus{border-color:#7bbfa3;box-shadow:0 0 0 4px rgba(21,122,82,.18);transform:translateY(-2px)}
.otp-timer{font-size:13px;color:var(--muted);text-align:center}
.resend-link{background:none;border:0;color:var(--primary);font-weight:800;padding:0}
.toast{position:fixed;right:20px;bottom:20px;background:#14231d;color:#fff;padding:13px 16px;border-radius:13px;box-shadow:0 24px 50px -14px rgba(20,35,29,.6);z-index:60;max-width:330px;font-size:13px;animation:fadeUp .35s both}
.approve-demo{margin-top:18px;padding-top:16px;border-top:1px dashed var(--line);display:flex;align-items:center;gap:10px;font-size:12px;color:var(--muted)}
.placeholder-drop{width:100%;display:none}
.confetti{position:fixed;top:-16px;width:9px;height:14px;z-index:2;pointer-events:none;border-radius:2px;animation:confettiFall linear forwards}
.carousel{position:relative}
.carousel-viewport{overflow:hidden;border-radius:18px;perspective:1400px;touch-action:pan-y;cursor:grab}
.carousel-viewport:active{cursor:grabbing}
.carousel-track{display:flex;transition:transform .6s cubic-bezier(.22,1,.36,1);will-change:transform}
.carousel-slide{min-width:100%;padding:4px}
.carousel-controls{display:flex;align-items:center;justify-content:center;gap:14px;margin-top:14px}
.carousel-nav{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:#fff;color:var(--primary);display:grid;place-items:center;box-shadow:0 8px 20px -16px rgba(16,49,38,.6);transition:.22s;position:relative;overflow:hidden}
.carousel-nav:hover{background:var(--grad);color:#fff;border-color:transparent;transform:translateY(-2px)}
.carousel-dots{display:flex;gap:7px;align-items:center}
.carousel-dot{width:8px;height:8px;border-radius:999px;border:0;padding:0;background:#cbd8d1;transition:.32s}
.carousel-dot.active{width:24px;background:var(--grad)}
.perk-carousel{margin-top:26px}
.flip-card{position:relative;height:172px;transform-style:preserve-3d;transition:transform .7s cubic-bezier(.22,1,.36,1);cursor:pointer;outline:none}
.flip-card.flipped{transform:rotateY(180deg)}
.flip-face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:16px;padding:20px;display:flex;flex-direction:column;gap:10px;color:#fff;box-shadow:0 24px 46px -26px rgba(16,49,38,.65);overflow:hidden}
.flip-front{justify-content:flex-end}
.flip-back{transform:rotateY(180deg);justify-content:center;background:linear-gradient(135deg,#0e2b22,#175c45 55%,#1c6b50)}
.flip-ic{width:46px;height:46px;border-radius:13px;background:rgba(255,255,255,.2);display:grid;place-items:center;margin-bottom:auto;backdrop-filter:blur(6px)}
.flip-face strong{font-size:16px;letter-spacing:-.2px}
.flip-face p{font-size:12.5px;line-height:1.6;opacity:.92;margin:0}
.flip-hint{font-size:11px;opacity:.85;display:inline-flex;align-items:center;gap:6px;font-weight:600}
.doc-carousel .carousel-slide{padding:6px}
@media(max-width:980px){.auth-shell{grid-template-columns:1fr;gap:30px}.auth-copy h1{font-size:30px}}
@media(max-width:640px){.form-grid{grid-template-columns:1fr}.full{grid-column:auto}.radio-grid{grid-template-columns:1fr 1fr}.radio-tile{height:116px}.onboarding-wrap{padding:24px 0}.stepper{gap:4px}.step .step-label{display:none}.otp-box{width:44px;height:52px}.auth-page{padding:20px 14px}.flip-card{height:186px}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}}
</style>
</head>
<body>
<div class="bg-slideshow" aria-hidden="true">
<span style="background-image:url('assets/backgrounds/bg-1.jpg')"></span>
<span style="background-image:url('assets/backgrounds/bg-2.jpg')"></span>
<span style="background-image:url('assets/backgrounds/bg-3.jpg')"></span>
<span style="background-image:url('assets/backgrounds/bg-4.jpg')"></span>
<span style="background-image:url('assets/backgrounds/bg-5.jpg')"></span>

const app = document.querySelector('#app');
const icons = {

  upload: 'upload', id: 'id-card', fingerprint: 'fingerprint', camera: 'camera',
  car: 'truck', shield: 'shield-check', mail: 'mail', phone: 'phone',
  lock: 'lock', user: 'user', clock: 'clock', alert: 'alert-circle',
  file: 'file-text', bike: 'bike', refresh: 'refresh-cw', badge: 'badge-check',
  calendar: 'calendar', truck: 'truck', edit: 'pencil', info: 'info',
  zap: 'zap', wallet: 'wallet', map: 'map', star: 'star', sparkles: 'sparkles',
  chevronLeft: 'chevron-left', chevronRight: 'chevron-right', trending: 'trending-up'
};
const icon = (name, size = 16) => `<i data-lucide="${name}" width="${size}" height="${size}"></i>`;
const renderIcons = () => window.lucide?.createIcons();
const escAttr = (v) => String(v == null ? '' : v).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

const MOTTO = 'Deliver smart. Earn more. Go Routewise.';
const MOTTO_SUB = 'Join thousands of couriers moving Zimbabwe forward.';

const API_BASE = location.protocol.startsWith('http') ? location.origin : 'http://localhost:5000';
const SERVER_DOWN_MSG = 'Cannot reach the Routewise server. Please make sure it is running, then try again.';
const SESSION_KEY = 'routewise_session';
const DRAFT_KEY = 'routewise_draft';
const SIGNUP_KEY = 'routewise_signup_account';

let view = 'auth';
let authMode = 'signin';
let onboardingStep = 1;
let stepped = { 1: false, 2: false, 3: false, 4: false };
let session = null;
let pendingSignup = null;
let demoCode = '';
let fields = {
  personal: { firstName: '', lastName: '', email: '', phone: '', dob: '', nationalId: '', address: '', city: '' },
  identity: { idType: 'National ID', idNumber: '', idPhoto: null, selfie: null },
  vehicle: { type: '', make: '', model: '', year: '', regNumber: '', insurance: '', insuranceExpiry: '' },
  documents: { licence: null, vehicleReg: null, insuranceCert: null }
};

const loadSession = () => {
  try { session = JSON.parse(localStorage.getItem(SESSION_KEY)); } catch { session = null; }
  if (session) {
    try {
      const d = JSON.parse(localStorage.getItem(DRAFT_KEY) || '{}');
      if (d.fields) fields = Object.assign(fields, d.fields);
      if (d.pendingSignup) pendingSignup = d.pendingSignup;
      if (d.demoCode) demoCode = d.demoCode;
    } catch {}
  }
};
const saveSession = () => localStorage.setItem(SESSION_KEY, JSON.stringify(session));
const saveDraft = () => localStorage.setItem(DRAFT_KEY, JSON.stringify({ fields, pendingSignup, demoCode, stepped }));
function savedSignup() { try { return JSON.parse(localStorage.getItem(SIGNUP_KEY) || 'null'); } catch { return null; } }
function saveSignup(acc) { try { localStorage.setItem(SIGNUP_KEY, JSON.stringify(acc)); } catch {} }

let toastTimer;
function toast(msg, error) {
  document.querySelector('.toast')?.remove();
  const el = document.createElement('div');
  el.className = 'toast';
  el.style.background = error ? '#c0392b' : '#14231d';
  el.textContent = msg;
  document.body.appendChild(el);
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.remove(), 3200);
}

function initCarousel(root) {
  const track = root.querySelector('.carousel-track');
  const viewport = root.querySelector('.carousel-viewport');
  if (!track || !viewport) return;
  const slides = Array.from(track.children);
  const dotWrap = root.querySelector('.carousel-dots');
  const n = slides.length;
  if (!n) return;
  let index = 0, timer = null, drag = null;
  const autoplay = parseInt(root.dataset.autoplay || '0', 10);
  const render = (animate) => {
    track.style.transition = animate ? 'transform .6s cubic-bezier(.22,1,.36,1)' : 'none';
    track.style.transform = `translate3d(${-index * 100}%,0,0)`;
    if (dotWrap) Array.from(dotWrap.children).forEach((d, i) => d.classList.toggle('active', i === index));
  };
  const go = (k) => { index = (k % n + n) % n; render(true); };
  const restart = () => { if (!autoplay) return; clearInterval(timer); timer = setInterval(() => go(index + 1), autoplay); };
  if (dotWrap) {
    dotWrap.innerHTML = '';
    slides.forEach((_, i) => {
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'carousel-dot'; b.setAttribute('aria-label', 'Go to slide ' + (i + 1));
      b.addEventListener('click', () => { go(i); restart(); });
      dotWrap.appendChild(b);
    });
  }
  root.querySelector('.carousel-prev')?.addEventListener('click', () => { go(index - 1); restart(); });
  root.querySelector('.carousel-next')?.addEventListener('click', () => { go(index + 1); restart(); });
  root.addEventListener('mouseenter', () => clearInterval(timer));
  root.addEventListener('mouseleave', restart);
  const onMove = (e) => {
    if (!drag) return;
    drag.dx = e.clientX - drag.x;
    if (Math.abs(drag.dx) > 8) {
      drag.moved = true;
      track.style.transition = 'none';
      track.style.transform = `translate3d(calc(${-index * 100}% + ${drag.dx}px),0,0)`;
    }
  };
  const endDrag = () => {
    window.removeEventListener('pointermove', onMove);
    window.removeEventListener('pointerup', endDrag);
    window.removeEventListener('pointercancel', endDrag);
    if (!drag) return;
    const d = drag.dx, moved = drag.moved;
    drag = null;
    if (Math.abs(d) > 40) go(index + (d < 0 ? 1 : -1)); else render(true);
    if (moved) { window.__carouselSwipe = true; setTimeout(() => { window.__carouselSwipe = false; }, 90); }
    restart();
  };
  viewport.addEventListener('pointerdown', (e) => {
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    drag = { x: e.clientX, dx: 0, moved: false };
    clearInterval(timer);
    window.addEventListener('pointermove', onMove);
    window.addEventListener('pointerup', endDrag);
    window.addEventListener('pointercancel', endDrag);
  });
  render(false);
  restart();
}

function initCarousels() {
  document.querySelectorAll('.carousel').forEach(initCarousel);
}

function burstConfetti() {
  const colors = ['#157a52', '#1a9c6b', '#0d7a72', '#d98410', '#b45309', '#4a5a53'];
  for (let i = 0; i < 44; i++) {
    const c = document.createElement('i');
    c.className = 'confetti';
    c.style.left = Math.random() * 100 + 'vw';
    c.style.background = colors[i % colors.length];
    c.style.animationDelay = (Math.random() * 0.7).toFixed(2) + 's';
    c.style.animationDuration = (2.2 + Math.random() * 1.6).toFixed(2) + 's';
    document.body.appendChild(c);
    setTimeout(() => c.remove(), 4200);
  }
}

document.addEventListener('click', e => {
  const card = e.target.closest('.flip-card');
  if (card && !window.__carouselSwipe) card.classList.toggle('flipped');
  const btn = e.target.closest('.primary-button,.secondary-button,.carousel-nav');
  if (btn && !btn.disabled) {
    const r = btn.getBoundingClientRect();
    const s = document.createElement('span');
    s.className = 'ripple';
    s.style.left = (e.clientX - r.left) + 'px';
    s.style.top = (e.clientY - r.top) + 'px';
    btn.appendChild(s);
    setTimeout(() => s.remove(), 620);
  }
});

async function api(path, method, body) {
  try {
    const res = await fetch(API_BASE + path, {
      method,
      headers: { 'Content-Type': 'application/json' },
      body: body ? JSON.stringify(body) : undefined
    });
    const data = await res.json();
    if (!res.ok) return { ok: false, error: data.error || 'Request failed' };
    return { ok: true, ...data };
  } catch {
    return null;
  }
}

async function uploadDoc(docType, file) {
  if (!session) return { error: 'You are not signed in. Please sign in again.' };
  const fd = new FormData();
  fd.append('driver_id', String(session.driver.driver_id));
  fd.append('doc_type', docType);
  fd.append('file', file);
  try {
    const res = await fetch(API_BASE + '/api/upload', { method: 'POST', body: fd });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) return { error: data.error || 'Upload failed' };
    return { name: data.name, type: data.mime, size: data.size, path: data.path };
  } catch {
    return { error: SERVER_DOWN_MSG };
  }
}

async function register(d) {
  const live = await api('/api/register', 'POST', {
    first_name: d.firstName, last_name: d.lastName, email: d.email, phone: d.phone, password: d.password
  });
  if (live === null) return { ok: false, error: SERVER_DOWN_MSG };
  if (live.ok) {
    demoCode = live.demo_code || '';
    return { ok: true, live: true, code: demoCode };
  }
  return { ok: false, error: live.error };
}

async function verifyOtp(d) {
  const live = await api('/api/verify-otp', 'POST', { phone: d.phone, code: d.code });
  if (live === null) return { ok: false, error: SERVER_DOWN_MSG };
  if (live.ok) return { ok: true, live: true, driver: live.driver };
  return { ok: false, error: live.error };
}

async function login(d) {
  const email = String(d.email || '').trim().toLowerCase();
  const live = await api('/api/login', 'POST', { email, password: d.password });
  if (live === null) return { ok: false, error: SERVER_DOWN_MSG };
  if (live.ok) return { ok: true, live: true, driver: live.driver };
  return { ok: false, error: live.error };
}

function brand() { return `<div class="brand-lockup"><div class="brand-mark">${icon(icons.logo, 19)}</div><span>routewise</span></div>`; }
function brandWrap() { return `<div class="brand-tag">${icon(icons.sparkles, 13)} Driver portal</div>`; }

    { ic: icons.wallet, t: 'Weekly payouts', d: 'Get paid every week, straight to your mobile wallet. No waiting around.', grad: 'linear-gradient(135deg,#0d7a72,#17a396)' },

function renderAuth() {
  view = 'auth';
  const copy = authMode === 'signin'
    ? { t: 'Welcome back', s: 'Sign in to manage your driver application and deliveries.' }
    : { t: 'Become a delivery partner', s: 'Apply to provide courier delivery services with Routewise. It takes about ten minutes.' };
  app.innerHTML = `<main class="auth-page"><div class="auth-shell">
    <section class="auth-hero">
      ${brand()}${brandWrap()}
      <div class="auth-copy"><h1>${copy.t}</h1><p>${copy.s}</p><p class="motto">${MOTTO}</p><p class="motto-sub">${MOTTO_SUB}</p></div>
      ${perksCarousel()}
    </section>
    <section class="auth-panel">
      <div class="auth-card">
        <div class="segmented"><button class="${authMode === 'signin' ? 'active' : ''}" data-auth="signin">Sign in</button><button class="${authMode === 'signup' ? 'active' : ''}" data-auth="signup">Sign up</button></div>
        ${authMode === 'signin' ? signinForm() : signupForm()}
        <p class="auth-note">${authMode === 'signin' ? 'Use the email and password you registered with.' : 'A one-time code will be sent to verify your phone number.'}</p>
      </div>
    </section>
  </div></main>`;

function fieldHtml(id, label, type, placeholder, extra = '') { return `<div class="field"><label for="${id}">${label}</label><input id="${id}" type="${type}" placeholder="${placeholder}" ${extra}></div>`; }

function signinForm() {
  const s = savedSignup() || {};
  return `<form id="login-form">${fieldHtml('email', 'Email address', 'email', 'you@example.com', `required autocomplete="email" value="${escAttr(s.email)}"`)}${fieldHtml('password', 'Password', 'password', 'Enter your password', `required autocomplete="current-password" value="${escAttr(s.password)}"`)}<button class="primary-button full-width" type="submit">Sign in ${icon(icons.arrow)}</button></form>`;
}

function signupForm() {
  return `<form id="signup-form"><div class="form-grid">${fieldHtml('first-name', 'First name', 'text', 'Tendai', 'required')}${fieldHtml('last-name', 'Last name', 'text', 'Moyo', 'required')}</div>${fieldHtml('signup-email', 'Email address', 'email', 'you@example.com', 'required autocomplete="email"')}${fieldHtml('signup-phone', 'Phone number', 'tel', '+263 77 000 0000', 'required pattern="[0-9+ ]{10,}"')}${fieldHtml('signup-password', 'Create password', 'password', 'At least 8 characters', 'required minlength="8"')}<button class="primary-button full-width" type="submit">Create account ${icon(icons.arrow)}</button></form>`;
}

function bindAuth() {
  document.querySelectorAll('[data-auth]').forEach(btn => btn.addEventListener('click', () => {
    authMode = btn.dataset.auth;
    onboardingStep = 1;
    renderAuth();
  }));
  document.querySelector('#login-form')?.addEventListener('submit', async e => {
    e.preventDefault();
    const r = await login({ email: e.target.email.value, password: e.target.password.value });
    if (!r.ok) return toast(r.error || 'Could not sign in.', true);
    session = { driver: r.driver, live: r.live };
    saveSession();
    afterLogin();
  });
  document.querySelector('#signup-form')?.addEventListener('submit', async e => {
    e.preventDefault();
    const d = {
      firstName: e.target['first-name'].value, lastName: e.target['last-name'].value,
      email: e.target['signup-email'].value, phone: e.target['signup-phone'].value,
      password: e.target['signup-password'].value
    };
    const r = await register(d);
    if (!r.ok) return toast(r.error, true);
    const account = { email: String(d.email || '').trim().toLowerCase(), password: d.password, firstName: d.firstName, lastName: d.lastName, phone: d.phone };
    saveSignup(account);
    pendingSignup = d;
    demoCode = r.code || '';
    fields.personal.firstName = d.firstName;
    fields.personal.lastName = d.lastName;
    fields.personal.email = d.email;
    fields.personal.phone = d.phone;
    stepped = { 1: false, 2: false, 3: false, 4: false };
    saveDraft();
    renderOtp(r.live, r.code);
  });
}

function otpBoxes(html = '') {
  return `<div class="otp-row">${[0,1,2,3,4,5].map(i => `<input class="otp-box" data-i="${i}" maxlength="1" inputmode="numeric" value="${(html[i] || '')}">`).join('')}</div>`;
}

function renderOtp(live, code) {
  view = 'otp';
  const phone = pendingSignup ? pendingSignup.phone : fields.personal.phone;
  app.innerHTML = `<main class="auth-page"><section class="auth-panel" style="max-width:460px">
    ${brand()}${brandWrap()}
    <div class="auth-copy"><h1>Verify your number</h1><p>We sent a 6-digit code to <strong>${phone}</strong>. Enter it below to confirm this is really you.</p><p class="motto">${MOTTO}</p></div>
    <div class="auth-card">
      ${otpBoxes()}
      <p class="otp-timer">Code expires in <strong id="otp-count">10:00</strong>. Didn't get it? <button class="resend-link" id="resend-otp">Resend code</button></p>
      ${code ? `<div class="notice" style="margin-top:16px">${icon(icons.info, 14)}<span>Demo environment — your one-time code is <strong>${code}</strong>.</span></div>` : ''}
      <button class="primary-button full-width" id="verify-btn" style="margin-top:18px">Verify and continue ${icon(icons.arrow)}</button>
    </div>
  </section></main>`;
  bindOtp();
  renderIcons();
}

function bindOtp() {
  let countdown = 600;
  const timer = document.querySelector('#otp-count');
  if (timer) {
    const tick = () => {
      countdown--;
      if (countdown <= 0) { clearInterval(interval); timer.textContent = 'expired'; return; }
      timer.textContent = String(Math.floor(countdown / 60)).padStart(2, '0') + ':' + String(countdown % 60).padStart(2, '0');
    };
    const interval = setInterval(tick, 1000);
  }
  const boxes = document.querySelectorAll('.otp-box');
  boxes.forEach((box, i) => {
    box.addEventListener('input', () => {
      box.value = box.value.replace(/\D/g, '');
      if (box.value && i < boxes.length - 1) boxes[i + 1].focus();
    });
    box.addEventListener('keydown', e => {
      if (e.key === 'Backspace' && !box.value && i > 0) boxes[i - 1].focus();
    });
    box.addEventListener('paste', e => {
      e.preventDefault();
      const digits = (e.clipboardData.getData('text') || '').replace(/\D/g, '').slice(0, 6);
      for (let j = 0; j < digits.length; j++) { if (boxes[j]) boxes[j].value = digits[j]; }
      if (digits.length) boxes[Math.min(digits.length, 5)].focus();
    });
  });
  document.querySelector('#resend-otp')?.addEventListener('click', async () => {
    const r = await api('/api/resend-otp', 'POST', { phone: pendingSignup.phone });
    if (r === null) {
      return toast(SERVER_DOWN_MSG, true);
    }
    if (r.ok) {
      if (r.demo_code) {
        demoCode = r.demo_code;
        return toast(`New code: ${demoCode}`);
      }
      return toast('A new code has been sent to your phone.');
    }
    toast('Could not resend the code. Try again in a moment.', true);
  });
  document.querySelector('#verify-btn').addEventListener('click', submitOtp);
  boxes.forEach(b => b.addEventListener('keydown', e => { if (e.key === 'Enter') submitOtp(); }));
}

async function submitOtp() {
  const code = Array.from(document.querySelectorAll('.otp-box')).map(b => b.value).join('');
  if (code.length < 6) return toast('Enter all six digits.', true);
  const r = await verifyOtp({ phone: pendingSignup.phone, code });
  if (!r.ok) {
    const row = document.querySelector('.otp-row');
    if (row) { row.classList.add('shake'); setTimeout(() => row.classList.remove('shake'), 520); }
    return toast(r.error || 'Verification failed.', true);
  }
  session = { driver: r.driver, live: r.live };
  saveSession();
  toast('Phone verified. Welcome aboard.');
  onboardingStep = 1;
  renderOnboarding();
}

function afterLogin() {
  if (!session) return;
  if (session.driver.onboarded === 1 || localStorage.getItem('routewise_submitted')) {
    renderStatus();
  } else {
    if (!localStorage.getItem(DRAFT_KEY)) {
      fields.personal.firstName = session.driver.first_name;
      fields.personal.lastName = session.driver.last_name;
      fields.personal.email = session.driver.email;
      fields.personal.phone = session.driver.phone;
      saveDraft();
    }
    onboardingStep = 1;
    renderOnboarding();
  }
}

function submitApplication() {
  localStorage.setItem('routewise_submitted', '1');
  saveDraft();
  renderStatus();
}

async function persistApplication() {
  const acc = savedSignup();
  if (acc) { acc.firstName = fields.personal.firstName; acc.lastName = fields.personal.lastName; acc.phone = fields.personal.phone; saveSignup(acc); }
  if (!session || !session.live) return;
  const d = session.driver;
  await api('/api/application', 'PUT', {
    driver_id: d.driver_id,
    personal: { first_name: fields.personal.firstName, last_name: fields.personal.lastName, dob: fields.personal.dob, address: fields.personal.address, city: fields.personal.city, national_id: fields.personal.nationalId },
    identity: { id_number: fields.identity.idNumber },
    vehicle: {
      type: fields.vehicle.type, make: fields.vehicle.make, model: fields.vehicle.model,
      year: fields.vehicle.year, reg_number: fields.vehicle.regNumber,
      insurance: fields.vehicle.insurance, insurance_expiry: fields.vehicle.insuranceExpiry
    }
  });
  if (session.driver.driver_id !== 'DEMO') {
    await api('/api/application/submit', 'POST', { driver_id: session.driver.driver_id });
  }
}

async function renderStatus() {
  view = 'status';
  let appStatus = null;
  if (session && session.live) {
    const r = await api(`/api/application/${session.driver.driver_id}`, 'GET');
    if (r && r.ok && r.application) appStatus = r.application.status;
    else if (r && r.ok && !r.application) appStatus = null;
    else appStatus = localStorage.getItem('routewise_submitted') ? 'submitted' : null;
  } else {
    if (session && session.status) appStatus = session.status;
    else {
      const st = localStorage.getItem('routewise_submitted');
      appStatus = st === 'approved' || st === 'rejected' ? st : (st ? 'submitted' : null);
    }
  }
  renderStatusView(appStatus);
}

function renderStatusView(appStatus) {
  session.status = appStatus;
  saveSession();
  app.innerHTML = `<main class="auth-page"><section class="onboarding-wrap">
    ${brand()}
    <div class="onboarding-header"><div><div class="brand-tag" style="margin-top:0">${icon(icons.sparkles, 13)} Application status</div><h1>${appStatus === 'approved' ? 'Welcome to Routewise' : appStatus === 'rejected' ? 'Application status' : 'Application received'}</h1><p>${appStatus === 'approved' ? 'You are cleared to start accepting deliveries.' : appStatus === 'rejected' ? 'Review the reason below and reapply when ready.' : 'Here is where your driver application stands.'}</p></div></div>
    <div class="card">
      ${appStatus === 'approved' ? approvedCard() : appStatus === 'rejected' ? rejectedCard() : submittedCard(appStatus)}
      <div class="form-footer"><button class="secondary-button" id="signout">Sign out</button></div>
    </div>
  </section></main>`;
  document.querySelector('#signout')?.addEventListener('click', () => {
    session = null;
    localStorage.removeItem(SESSION_KEY);
    authMode = 'signin';
    renderAuth();
  });
  document.querySelector('#demo-approve')?.addEventListener('click', async () => {
    if (!session || !session.driver) return;
    const r = await api('/api/application/review', 'PUT', { driver_id: session.driver.driver_id, decision: 'approved' });
    if (!r) return toast(SERVER_DOWN_MSG, true);
    if (!r.ok) return toast(r.error || 'Could not simulate approval.', true);
    localStorage.setItem('routewise_submitted', 'approved');
    toast('Application approved (simulated).');
    await renderStatus();
  });
  if (appStatus === 'approved') burstConfetti();
  renderIcons();
}

function approvedCard() {
  return `<div class="success-box"><div class="success-ic">${icon(icons.badge, 32)}</div><h2>You have been approved</h2><p>Congratulations. Your application has been reviewed and accepted. You can now log in to the Routewise driver app and start accepting courier deliveries in your city.</p><p class="motto" style="margin-top:14px">${MOTTO}</p></div>
  <div class="pipeline">
    ${pipe('done', icons.check, 'Application submitted', 'We received your application')}
    ${pipe('done', icons.check, 'Reviewed', 'Documents verified by our team')}
    ${pipe('done', icons.check, 'Approved', 'You are ready to deliver')}
  </div>`;
}

function rejectedCard() {
  return `<div class="success-box"><div class="success-ic" style="background:#fef3f2;color:var(--red)">${icon(icons.alert, 32)}</div><h2>Application not approved</h2><p>Thanks for your patience. Our team was unable to approve this application at this time. You can reach out at partner@routewise.co.zw for more detail.</p></div>`;
}

function submittedCard(appStatus) {
  return `<div class="success-box"><div class="success-ic">${icon(icons.clock, 32)}</div><h2>Application submitted</h2><p>Thank you for applying to deliver with Routewise. Your details are now with our onboarding team. We will email you once your application has been reviewed — most decisions are made within one business day.</p></div>
  <div class="pipeline">
    ${pipe('done', icons.check, 'Submitted', 'We received your application')}
    ${pipe(appStatus === 'under_review' ? 'done' : 'next', icons.shield, 'Under review', 'Our team is verifying your documents')}
    ${pipe('next', icons.badge, 'Approval', 'You will be notified by email')}
  </div>
  <div class="approve-demo">${icon(icons.info, 14)}<span>Testing this screen? <button class="resend-link" id="demo-approve">Simulate approval</button></span></div>`;
}

function pipe(state, ic, t, s) {
  return `<div class="pipe-step ${state}"><span class="pipe-dot">${state === 'done' ? icon(icons.check, 13) : `<i data-lucide="${ic}" width="13" height="13"></i>`}</span><div class="pipe-copy"><strong>${t}</strong><p>${s}</p></div><div class="pipe-line"></div></div>`;
}

const stepNames = ['Personal', 'Identity', 'Vehicle', 'Documents'];

function renderOnboarding() {
  view = 'onboarding';
  const header = {
    1: ['Tell us about yourself', 'We use these details to set up your driver profile and keep in touch.'],
    2: ['Verify your identity', 'We need to confirm who you are before you start delivering.'],
    3: ['Add your vehicle', 'Tell us what you will use for courier deliveries.'],
    4: ['Upload your documents', 'We need clear copies of the documents listed below.'],
    5: ['Review your application', 'Confirm everything looks right before you submit.']
  };
  const title = onboardingStep <= 5 ? header[onboardingStep] : ['Application submitted', ''];
  app.innerHTML = `<main class="auth-page"><section class="onboarding-wrap">
    ${brand()}
    <div class="onboarding-header"><div><h1>${title[0]}</h1><p>${title[1]}</p></div><button class="secondary-button" id="save-exit">Save and exit</button></div>
    ${onboardingStep <= 4 ? `<div class="stepper">${stepNames.map((n, i) => `<div class="step ${i + 1 === onboardingStep ? 'active' : ''} ${i + 1 < onboardingStep ? 'complete' : ''}"><span class="step-number">${i + 1 < onboardingStep ? icon(icons.check, 13) : i + 1}</span><span class="step-label">${n}</span></div>`).join('')}</div><div class="progress-rail"><span style="width:${(onboardingStep - 1) / 3 * 100}%"></span></div>` : ''}
    <div class="card">${stepContent()}</div>
  </section></main>`;
  document.querySelector('#save-exit')?.addEventListener('click', () => {
    saveDraft();
    session = null; localStorage.removeItem(SESSION_KEY);
    authMode = 'signin';
    renderAuth();
  });
  bindStepActions();
  bindUploads();
  initCarousels();
  renderIcons();
}

function stepContent() {
  switch (onboardingStep) {
    case 1: return personalStep();
    case 2: return identityStep();
    case 3: return vehicleStep();
    case 4: return documentsStep();
    case 5: return reviewStep();
  }
}

function personalStep() {
  const p = fields.personal;
  return `<div class="stackrow"><h2>Personal details</h2><p class="card-sub">Your full legal name and main contact number.</p></div>
  <div class="form-grid">
    <div class="field"><label for="first-name">First name</label><input id="first-name" value="${p.firstName}" placeholder="Tendai" required></div>
    <div class="field"><label for="last-name">Last name</label><input id="last-name" value="${p.lastName}" placeholder="Moyo" required></div>
    <div class="field"><label for="dob">Date of birth</label><input id="dob" type="date" value="${p.dob}" required></div>
    <div class="field"><label for="national-id">National ID number</label><input id="national-id" value="${p.nationalId}" placeholder="63-1234567 K 28" required></div>
    <div class="field"><label for="email">Email address</label><input id="email" value="${p.email}" readonly></div>
    <div class="field"><label for="phone">Phone number</label><input id="phone" value="${p.phone}" readonly></div>
    <div class="field full"><label for="address">Home address</label><input id="address" value="${p.address}" placeholder="12 Samora Machel Ave, Avondale" required></div>
    <div class="field full"><label for="city">Operating city</label><select id="city" required><option value="">Choose a city</option>${['Harare','Bulawayo','Mutare','Gweru','Victoria Falls'].map(c => `<option ${p.city === c ? 'selected' : ''}>${c}</option>`).join('')}</select></div>
  </div>
  <div class="form-footer"><button class="secondary-button" data-back>Back</button><button class="primary-button" data-next>Continue ${icon(icons.arrow)}</button></div>`;
}

function identityStep() {
  const id = fields.identity;
  const opts = ['National ID', 'Passport'];
  return `<div class="stackrow"><h2>Identity verification</h2><p class="card-sub">Choose your ID type and upload a clear photo of it, plus a recent selfie.</p></div>
  <div class="form-grid">
    <div class="field full"><label for="id-type">Identity document type</label><select id="id-type">${opts.map(o => `<option ${id.idType === o ? 'selected' : ''}>${o}</option>`).join('')}</select></div>
    <div class="field full"><label for="id-number">Document number</label><input id="id-number" value="${id.idNumber}" placeholder="e.g. 63-1234567 K 28" required></div>
  </div>
  <div class="divider"></div>
  <div class="stackrow">${uploadBox('id-photo', icons.id, 'National ID photo', 'PNG or JPG, up to 5 MB', filesLong('identity.idPhoto'))}</div>
  <div class="stackrow">${uploadBox('selfie', icons.camera, 'Selfie / portrait photo', 'A recent clear photo of your face', filesLong('identity.selfie'))}</div>
  <div class="confirm-row"><input type="checkbox" id="confirm-identity"><label for="confirm-identity">I confirm the identity document belongs to me and the details above are accurate.</label></div>
  <div class="form-footer"><button class="secondary-button" data-back>Back</button><button class="primary-button" data-next>Continue ${icon(icons.arrow)}</button></div>`;
}

function vehicleStep() {
  const v = fields.vehicle;
  const types = [
    ['car', icons.car, 'Car', 'Best for small parcels across town'],
    ['truck', icons.truck, 'Van / truck', 'For bulky loads and big deliveries'],
    ['motorcycle', icons.bike, 'Motorcycle', 'Fast and nimble through traffic'],
    ['bicycle', icons.bike, 'Bicycle', 'Eco-friendly for short city hops']
  ];
  return `<div class="stackrow"><h2>Vehicle details</h2><p class="card-sub">Tap to select, hover a tile to see what it is best for.</p></div>
  <div class="radio-grid" id="vehicle-types">${types.map(([t, ic, label, desc]) => `<button type="button" class="radio-tile ${v.type === t ? 'sel' : ''}" data-type="${t}"><span class="tile-check">${icon(icons.check, 12)}</span><span class="tile-inner"><span class="tile-face tile-front">${icon(ic, 24)}<span>${label}</span></span><span class="tile-face tile-back"><span><strong>${label}</strong>${desc}</span></span></span></button>`).join('')}</div>
  <div class="form-grid" style="margin-top:24px">
    <div class="field"><label for="make">Make</label><input id="make" value="${v.make}" placeholder="Toyota" required></div>
    <div class="field"><label for="model">Model</label><input id="model" value="${v.model}" placeholder="Aqua" required></div>
    <div class="field"><label for="year">Year of manufacture</label><input id="year" type="number" value="${v.year}" placeholder="2018" min="1990" max="2026" required></div>
    <div class="field"><label for="reg">Registration number</label><input id="reg" value="${v.regNumber}" placeholder="AEG 4123" required></div>
    <div class="field"><label for="insurance-provider">Insurance provider</label><input id="insurance-provider" value="${v.insurance}" placeholder="Old Mutual / Nyaradzo / First Mutual" required></div>
    <div class="field"><label for="insurance-expiry">Insurance expiry date</label><input id="insurance-expiry" type="date" value="${v.insuranceExpiry}" required></div>
  </div>
  <div class="form-footer"><button class="secondary-button" data-back>Back</button><button class="primary-button" data-next>Continue ${icon(icons.arrow)}</button></div>`;
}

function documentsStep() {
  const docs = [
    ['driving', icons.id, 'Valid driver\u2019s licence', 'Front and back copy', filesLong('documents.licence')],
    ['vehicle-reg', icons.file, 'Vehicle registration', 'Current registration certificate', filesLong('documents.vehicleReg')],
    ['insurance-cert', icons.shield, 'Certificate of insurance', 'Must match your vehicle details', filesLong('documents.insuranceCert')]
  ];
  return `<div class="stackrow"><h2>Required documents</h2><p class="card-sub">Swipe or use the arrows, then upload a clear copy of each document. Photos or scanned PDFs are fine.</p></div>
  <div class="carousel doc-carousel">
    <div class="carousel-viewport"><div class="carousel-track">
      ${docs.map(([id, ic, name, det, val]) => `<div class="carousel-slide">${uploadCheck(id, ic, name, det, val)}</div>`).join('')}
    </div></div>
    <div class="carousel-controls">
      <button type="button" class="carousel-nav carousel-prev" aria-label="Previous document">${icon(icons.chevronLeft, 16)}</button>
      <div class="carousel-dots"></div>
      <button type="button" class="carousel-nav carousel-next" aria-label="Next document">${icon(icons.chevronRight, 16)}</button>
    </div>
  </div>
  <div class="check-row done" style="border:0;padding:14px 0 6px"><div class="check-ic">${icon(icons.check)}</div><div><div class="ch-name">Identity documents</div><div class="ch-det">Added during identity verification</div></div></div>
  <div class="form-footer"><button class="secondary-button" data-back>Back</button><button class="primary-button" data-next>Review application ${icon(icons.arrow)}</button></div>`;
}

function uploadBox(id, ic, label, meta, value) {
  return `<div class="upload-box ${value ? 'done' : ''}" id="${id}-box"><div class="upload-ic">${icon(value ? icons.check : icons.upload)}</div><div><div class="up-label">${label}</div><div class="up-meta">${value || meta}</div></div><input type="file" id="${id}" accept="image/*,.pdf"></div>`;
}

function uploadCheck(id, ic, name, det, value) {
  return `<div class="upload-box ${value ? 'done' : ''}" id="${id}-box"><div class="upload-ic">${icon(value ? icons.check : icons.upload)}</div><div><div class="up-label">${name}</div><div class="up-meta">${value || det}</div></div><input type="file" id="${id}" accept="image/*,.pdf"></div>`;
}

function filesLong(path) {
  const parts = path.split('.');
  const obj = parts[0] === 'identity' ? fields.identity : fields.documents;
  const f = obj[parts[1]];
  return f ? `${f.name} (${(f.size / 1024).toFixed(0)} KB)` : '';
}

function reviewStep() {
  const p = fields.personal, id = fields.identity, v = fields.vehicle;
  return `<div class="stackrow"><h2>Ready to submit?</h2><p class="card-sub">Check your details below. You can go back to any step to make changes.</p></div>
  <div class="review-sec">Personal</div>
  <div class="review-list">
    ${reviewRow('Full name', p.firstName + ' ' + p.lastName)}
    ${reviewRow('Date of birth', p.dob || 'Not provided')}
    ${reviewRow('Email address', p.email)}
    ${reviewRow('Phone number', p.phone)}
    ${reviewRow('Address', p.address || 'Not provided')}
    ${reviewRow('City', p.city)}
  </div>
  <div class="review-sec">Identity</div>
  <div class="review-list">
    ${reviewRow('ID type', id.idType)}
    ${reviewRow('Document number', id.idNumber)}
    ${reviewRow('ID photo', id.idPhoto ? id.idPhoto.name : 'Not uploaded')}
    ${reviewRow('Selfie', id.selfie ? id.selfie.name : 'Not uploaded')}
  </div>
  <div class="review-sec">Vehicle</div>
  <div class="review-list">
    ${reviewRow('Type', v.type ? v.type[0].toUpperCase() + v.type.slice(1) : 'Not selected')}
    ${reviewRow('Make / model', (v.make + ' ' + v.model).trim())}
    ${reviewRow('Year', v.year)}
    ${reviewRow('Registration', v.regNumber)}
    ${reviewRow('Insurance', v.insurance + (v.insuranceExpiry ? ' · ' + v.insuranceExpiry : ''))}
  </div>
  <div class="review-sec">Documents</div>
  <div class="review-list">
    ${reviewRow('Driver\u2019s licence', fields.documents.licence ? fields.documents.licence.name : 'Not uploaded')}
    ${reviewRow('Vehicle registration', fields.documents.vehicleReg ? fields.documents.vehicleReg.name : 'Not uploaded')}
    ${reviewRow('Insurance certificate', fields.documents.insuranceCert ? fields.documents.insuranceCert.name : 'Not uploaded')}
  </div>
  <div class="confirm-row" style="margin-top:18px"><input type="checkbox" id="confirm-submit"><label for="confirm-submit">I confirm all information and documents provided are true and correct.</label></div>
  <div class="form-footer"><button class="secondary-button" data-back>Back</button><button class="primary-button" id="submit-application">Submit application ${icon(icons.check)}</button></div>`;
}

function reviewRow(k, v) { return `<div class="review-row"><span>${k}</span><strong>${v}</strong></div>`; }

function bindStepActions() {
  if (onboardingStep > 1) document.querySelector('[data-back]')?.addEventListener('click', () => {
    collectStep();
    onboardingStep--;
    renderOnboarding();
  });
  const next = document.querySelector('[data-next]');
  if (next) next.addEventListener('click', () => {
    if (!collectStep()) return;
    onboardingStep++;
    renderOnboarding();
  });
  document.querySelector('#vehicle-types')?.querySelectorAll('.radio-tile').forEach(tile => {
    tile.addEventListener('click', () => {
      fields.vehicle.type = tile.dataset.type;
      document.querySelectorAll('.radio-tile').forEach(t => t.classList.toggle('sel', t === tile));
    });
  });
  document.querySelector('#submit-application')?.addEventListener('click', () => {
    const box = document.querySelector('#confirm-submit');
    if (!box || !box.checked) return toast('Please tick the confirmation box before submitting.', true);
    localStorage.setItem('routewise_submitted', '1');
    saveDraft();
    persistApplication().then(() => renderStatus());
  });
}

function collectStep() {
  const collect = (id) => document.getElementById(id)?.value;
  switch (onboardingStep) {
    case 1: {
      const vals = {
        firstName: collect('first-name'), lastName: collect('last-name'), dob: collect('dob'),
        nationalId: collect('national-id'), address: collect('address'), city: collect('city'),
        email: collect('email') || fields.personal.email, phone: collect('phone') || fields.personal.phone
      };
      const required = [['firstName', 'First name'], ['lastName', 'Last name'], ['dob', 'date of birth'], ['nationalId', 'national ID number'], ['address', 'home address'], ['city', 'city']];
      for (const [k, label] of required) if (!vals[k]) return toast(`Please complete your ${label}.`, true);
      fields.personal = Object.assign(fields.personal, vals);
      return true;
    }
    case 2: {
      const number = collect('id-number');
      if (!number) return toast('Identity document number is required.', true);
      const box = document.querySelector('#confirm-identity');
      if (box && !box.checked) return toast('Please confirm your identity before continuing.', true);
      fields.identity.idType = collect('id-type') || fields.identity.idType;
      fields.identity.idNumber = number;
      if (!fields.identity.idPhoto) return toast('Please upload a photo of your identity document.', true);
      if (!fields.identity.selfie) return toast('Please upload a selfie photo.', true);
      return true;
    }
    case 3: {
      const vals = {
        type: fields.vehicle.type, make: collect('make'), model: collect('model'), year: collect('year'),
        regNumber: collect('reg'), insurance: collect('insurance-provider'), insuranceExpiry: collect('insurance-expiry')
      };
      if (!vals.type) return toast('Select a vehicle type.', true);
      for (const [k, label] of [['make', 'Make'], ['model', 'Model'], ['year', 'Year'], ['regNumber', 'Registration'], ['insurance', 'Insurance provider'], ['insuranceExpiry', 'Insurance expiry']]) {
        if (!vals[k]) return toast(`${label} is required.`, true);
      }
      fields.vehicle = Object.assign(fields.vehicle, vals);
      return true;
    }
    case 4: {
      if (!fields.documents.licence) return toast('Upload your driver\u2019s licence.', true);
      if (!fields.documents.vehicleReg) return toast('Upload your vehicle registration.', true);
      if (!fields.documents.insuranceCert) return toast('Upload your certificate of insurance.', true);
      return true;
    }
  }
  return true;
}

function bindUploads() {
  const spec = [
    ['id-photo', 'identity', 'idPhoto', 'national_id_photo'],
    ['selfie', 'identity', 'selfie', 'selfie'],
    ['driving', 'documents', 'licence', 'driving_licence'],
    ['vehicle-reg', 'documents', 'vehicleReg', 'vehicle_registration'],
    ['insurance-cert', 'documents', 'insuranceCert', 'insurance_certificate']
  ];
  spec.forEach(([id, group, key, docServerType]) => {
    const box = document.getElementById(id);
    const wrap = document.getElementById(id + '-box');
    if (!box || !wrap) return;
    wrap.addEventListener('click', (e) => { if (window.__carouselSwipe) return; if (e.target !== box) box.click(); });
    box.addEventListener('change', async () => {
      if (!box.files || !box.files[0]) return;
      const f = box.files[0];
      const meta = wrap.querySelector('.up-meta');
      if (meta) meta.textContent = 'Uploading\u2026';
      const result = await uploadDoc(docServerType, f);
      if (result.error) {
        if (meta) meta.textContent = 'Upload failed \u2014 try again';
        toast(result.error, true);
        return;
      }
      fields[group][key] = result;
      if (meta) meta.textContent = result.path ? `${result.name} (${(result.size / 1024).toFixed(0)} KB) \u00b7 uploaded` : `${result.name} (${(result.size / 1024).toFixed(0)} KB)`;
      wrap.classList.add('done');
      wrap.querySelector('.upload-ic').innerHTML = icon(icons.check);
      renderIcons();
      toast(result.path ? `${result.name} uploaded` : `${result.name} selected`);
      saveDraft();
    });
  });
}

loadSession();
renderAuth();
</script>
</body>
</html>
